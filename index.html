<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F8F7F4">
  <title>能量打卡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- ===== 今日 Tab ===== -->
    <div class="tab-content active" id="tab-today">
      <header class="header">
        <div class="greeting">
          <h1 class="greeting-text" id="greetingText">早上好</h1>
          <p class="date-text" id="dateText"></p>
        </div>
        <div class="header-energy" id="headerEnergy">
          <div class="energy-badge">
            <span>⚡</span>
            <span id="headerEnergyValue">0</span>
          </div>
        </div>
      </header>

      <div class="energy-ring-container">
        <svg class="energy-ring" viewBox="0 0 170 170">
          <circle class="ring-bg" cx="85" cy="85" r="78"></circle>
          <circle class="ring-progress" id="energyRing" cx="85" cy="85" r="78"></circle>
        </svg>
        <div class="energy-ring-center">
          <span class="energy-ring-value" id="energyRingValue">0</span>
          <span class="energy-ring-label">当前能量</span>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="streakDays">0</span>
          <span class="stat-label">连续打卡</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="todayDone">0/<span id="todayTotal">0</span></span>
          <span class="stat-label">今日完成</span>
        </div>
        <div class="stat-card stat-card-mood" id="moodCard">
          <img class="mood-display" id="moodDisplay" src="moods/smiling.svg" alt="今日心情" />
          <span class="stat-label mood-label">今日心情</span>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2>今日习惯</h2>
          <span class="section-badge" id="todayProgress">0%</span>
        </div>
        <div class="habit-list" id="todayHabitList">
          <div class="empty-state">
            <span class="empty-icon">—</span>
            <p>还没有习惯，去"我的"添加吧</p>
          </div>
        </div>
      </div>

      <!-- Diary Section with Mood Picker -->
      <div class="section diary-section">
        <div class="section-header">
          <h2>日记</h2>
          <span class="section-badge" id="diaryDateLabel">今天</span>
        </div>
        <div class="mood-picker" id="moodPicker"></div>
        <div class="diary-editor-wrap">
          <textarea id="diaryEditor" placeholder="记录今天的想法…"></textarea>
          <div class="diary-toolbar">
            <span class="diary-word-count" id="diaryWordCount">0 字</span>
            <button class="btn-diary-save" id="btnSaveDiary">保存</button>
          </div>
        </div>
        <div class="diary-list" id="diaryList"></div>
      </div>
    </div>

    <!-- ===== 计划 Tab ===== -->
    <div class="tab-content" id="tab-plans">
      <header class="header">
        <h1>计划</h1>
        <button class="btn-icon" id="btnAddPlan" title="添加计划">＋</button>
      </header>

      <!-- Calendar + Toggle -->
      <div class="section-header">
        <h2 id="planDateTitle">今日计划</h2>
        <div class="calendar-view-toggle" id="calendarViewToggle">
          <button class="toggle-option active" data-view="week">周</button>
          <button class="toggle-option" data-view="month">月</button>
        </div>
      </div>

      <!-- Week View -->
      <div class="calendar-strip" id="calendarStrip"></div>

      <!-- Month View -->
      <div class="month-calendar" id="monthCalendar">
        <div class="calendar-grid-header">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <!-- Plan List -->
      <div class="section">
        <div class="section-header">
          <h2>待办</h2>
          <span class="section-badge" id="planCount">0项</span>
        </div>
        <div class="plan-list" id="planList">
          <div class="empty-state">
            <span class="empty-icon">—</span>
            <p>暂无计划</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 奖励 Tab ===== -->
    <div class="tab-content" id="tab-rewards">
      <header class="header">
        <h1>奖励</h1>
        <button class="btn-icon" id="btnAddReward" title="添加奖励">＋</button>
      </header>

      <div class="reward-energy-bar">
        <div class="reward-energy-info">
          <span class="reward-energy-label">可用能量</span>
          <span class="reward-energy-amount" id="rewardEnergyAmount">0 ⚡</span>
        </div>
        <div class="reward-energy-track">
          <div class="reward-energy-fill" id="rewardEnergyFill"></div>
        </div>
        <div class="reward-energy-meta">
          <span>累计获得 <strong id="totalEarned">0</strong></span>
          <span>累计兑换 <strong id="totalSpent">0</strong></span>
        </div>
      </div>

      <div class="section">
        <div class="section-header"><h2>可兑换</h2></div>
        <div class="reward-grid" id="rewardGrid">
          <div class="empty-state">
            <span class="empty-icon">—</span>
            <p>还没有奖励</p>
          </div>
        </div>
      </div>

      <div class="section" id="redeemHistorySection" style="display:none;">
        <div class="section-header"><h2>兑换记录</h2></div>
        <div class="redeem-list" id="redeemList"></div>
      </div>
    </div>

    <!-- ===== 我的 Tab ===== -->
    <div class="tab-content" id="tab-profile">
      <header class="header"><h1>我的</h1></header>

      <div class="profile-stats">
        <div class="profile-stat">
          <span class="profile-stat-val" id="profileTotalEnergy">0</span>
          <span class="profile-stat-lbl">累计能量</span>
        </div>
        <div class="profile-stat">
          <span class="profile-stat-val" id="profileStreak">0天</span>
          <span class="profile-stat-lbl">最长连续</span>
        </div>
        <div class="profile-stat">
          <span class="profile-stat-val" id="profileCheckins">0次</span>
          <span class="profile-stat-lbl">总打卡</span>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2>我的习惯</h2>
          <button class="btn-icon small" id="btnAddHabit">＋</button>
        </div>
        <div class="habit-manage-list" id="habitManageList">
          <div class="empty-state">
            <span class="empty-icon">—</span>
            <p>添加你的第一个习惯吧</p>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-header"><h2>近7天能量</h2></div>
        <div class="energy-chart" id="energyChart">
          <div class="empty-state small"><p>开始打卡后会显示能量趋势</p></div>
        </div>
      </div>

      <div class="section">
        <button class="btn-danger" id="btnReset">重置所有数据</button>
      </div>
    </div>

    <!-- ===== 底部导航 ===== -->
    <nav class="bottom-nav">
      <div class="nav-item active" data-tab="today">
        <img class="nav-icon-svg" src="nav-icons/today.svg" alt="今日" />
      </div>
      <div class="nav-item" data-tab="plans">
        <img class="nav-icon-svg" src="nav-icons/plans.svg" alt="计划" />
      </div>
      <div class="nav-item" data-tab="rewards">
        <img class="nav-icon-svg" src="nav-icons/rewards.svg" alt="奖励" />
      </div>
      <div class="nav-item" data-tab="profile">
        <img class="nav-icon-svg" src="nav-icons/profile.svg" alt="我的" />
      </div>
    </nav>
  </div>

  <!-- ===== 习惯模态 ===== -->
  <div class="modal-overlay" id="modalHabit">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalHabitTitle">添加习惯</h3>
        <button class="btn-close modal-close">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="habitEditId">
        <div class="form-group"><label>习惯名称</label><input type="text" id="habitName" placeholder="例如：早起、跑步、阅读…"></div>
        <div class="form-group"><label>图标</label><div class="icon-picker" id="iconPicker"></div></div>
        <div class="form-group"><label>分类</label>
          <select id="habitCategory">
            <option value="健康">健康</option><option value="学习">学习</option><option value="生活">生活</option><option value="工作">工作</option><option value="社交">社交</option><option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group"><label>能量值 (1-100)</label><input type="range" id="habitEnergy" min="1" max="100" value="10"><span class="range-label" id="habitEnergyLabel">10 ⚡</span></div>
        <div class="form-group"><label>重复日</label><div class="weekday-picker" id="weekdayPicker"></div></div>
        <div class="form-group"><label>时段</label>
          <select id="habitTimeOfDay">
            <option value="anytime">任意时间</option><option value="morning">早晨</option><option value="afternoon">下午</option><option value="evening">晚上</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-close">取消</button>
        <button class="btn btn-primary" id="btnSaveHabit">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 计划模态 ===== -->
  <div class="modal-overlay" id="modalPlan">
    <div class="modal">
      <div class="modal-header"><h3>添加计划</h3><button class="btn-close modal-close">✕</button></div>
      <div class="modal-body">
        <div class="form-group"><label>标题</label><input type="text" id="planTitle" placeholder="要做什么？"></div>
        <div class="form-row">
          <div class="form-group flex-1"><label>日期</label><input type="date" id="planDate"></div>
          <div class="form-group flex-1"><label>时间</label><input type="time" id="planTime"></div>
        </div>
        <div class="form-group"><label>备注</label><textarea id="planDesc" rows="2" placeholder="详细描述（可选）"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-close">取消</button>
        <button class="btn btn-primary" id="btnSavePlan">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 奖励模态(添加/编辑) ===== -->
  <div class="modal-overlay" id="modalReward">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalRewardTitle">添加奖励</h3>
        <button class="btn-close modal-close">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="rewardEditId">
        <div class="form-group"><label>奖励名称</label><input type="text" id="rewardName" placeholder="例如：看一集剧、买杯奶茶…"></div>
        <div class="form-group"><label>图标</label><div class="icon-picker small" id="rewardIconPicker"></div></div>
        <div class="form-group"><label>所需能量值 (1-500)</label><input type="range" id="rewardCost" min="1" max="500" value="30"><span class="range-label" id="rewardCostLabel">30 ⚡</span></div>
        <div class="form-group"><label>描述</label><textarea id="rewardDesc" rows="2" placeholder="描述这个奖励（可选）"></textarea></div>
      </div>
      <div class="modal-footer" id="rewardModalFooter">
        <button class="btn btn-secondary modal-close">取消</button>
        <button class="btn btn-primary" id="btnSaveReward">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 兑换确认 ===== -->
  <div class="modal-overlay" id="modalRedeem">
    <div class="modal modal-sm">
      <div class="modal-body text-center">
        <div class="redeem-confirm-icon" id="redeemConfirmIcon"></div>
        <h3>确认兑换？</h3>
        <p style="color:var(--text-light);">消耗 <strong id="redeemConfirmCost">0 ⚡</strong></p>
        <p style="color:var(--text-light);">兑换后剩余 <strong id="redeemConfirmRemain">0 ⚡</strong></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-close">取消</button>
        <button class="btn btn-primary" id="btnConfirmRedeem">确认兑换</button>
      </div>
    </div>
  </div>

  <!-- ===== 兑换成功 ===== -->
  <div class="redeem-toast" id="redeemToast">
    <div class="redeem-toast-content">
      <span class="redeem-toast-icon">—</span>
      <p class="redeem-toast-title">兑换成功</p>
      <p class="redeem-toast-energy" id="redeemToastEnergy"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
